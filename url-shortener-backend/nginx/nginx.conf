events {}

http {
    log_format upstreamlog '$remote_addr - $request status=$status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstreamlog;

    upstream url_shortener_backend {
        zone url_shortener_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        least_conn;
        server app:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://url_shortener_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
