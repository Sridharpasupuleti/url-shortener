spring.application.name=url-shortener

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/urldatabase}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.cache.type=redis

app.rate-limit.url-creation.max-requests=${APP_RATE_LIMIT_URL_CREATION_MAX_REQUESTS:10}
app.rate-limit.url-creation.window-seconds=${APP_RATE_LIMIT_URL_CREATION_WINDOW_SECONDS:60}
app.rate-limit.redirect.max-requests=${APP_RATE_LIMIT_REDIRECT_MAX_REQUESTS:100}
app.rate-limit.redirect.window-seconds=${APP_RATE_LIMIT_REDIRECT_WINDOW_SECONDS:60}
app.rate-limit.trusted-proxies=${APP_RATE_LIMIT_TRUSTED_PROXIES:}

server.forward-headers-strategy=none